[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-pipeline"
version = "0.1.0"
description = "Foundation for a clean AutoML/MLOps pipeline."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "joblib>=1.3",
    "numpy>=1.24",
    "optuna>=3.5",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
