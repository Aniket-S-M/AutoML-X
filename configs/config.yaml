project:
  name: automl-pipeline
  environment: local
  random_seed: 42

data:
  input_path: data/input.csv
  raw_path: data/raw
  processed_path: data/processed
  target_column: Churn
  excluded_feature_columns:
    - customerID
  test_size: 0.2
  validation_size: 0.2

training:
  random_seed:
  metric: f1_yes

optimization:
  enabled: false
  n_trials: 25
  timeout_seconds:
  direction: maximize

model:
  artifact_path: models/artifacts
  default_model_name: baseline_model

monitoring:
  threshold: 0.1

evaluation_gate:
  # Provisional threshold approved for the controlled Airflow test.
  metric_name: f1_yes
  minimum_validation_score: 0.55

registry:
  path: models/registry
